# GTM fleet on NetClaw: the single source of truth for the NetClaw build.
#
# 3 NetClaw instances, 10 subagents, lead in to closed deal out, AE-only team.
# Each subagent is a conversational front end over the 17 runtime agents in agents/:
# the runtime computes (scores, routing, risk, forecast math) and queues every write
# for approval; NetClaw talks to AEs in Slack and calls those tools over MCP.
#
# Skills: `lib:<name>` resolves through library/index.json (licensed library),
# `lib:<name>@<source>` picks one source when a name exists twice, anything else is a
# path from the repo root. `python3 netclaw/build.py` validates all of it.

shared_skills:
  - netclaw/shared/gtm-playbooks
  - lib:sales-hubspot
  - lib:sales-salesforce

# Every runtime agent is served by `gtm serve-mcp <agent> --transport streamable-http`
# inside the gtm-tools container (netclaw/serve_tools.sh). Ports are fixed here.
mcp_servers:
  lead-triage:          {port: 8101}
  icp-outbound:         {port: 8102}
  seller-follow-up:     {port: 8103}
  deal-inspection:      {port: 8104}
  meeting-intelligence: {port: 8105}
  sales-execution:      {port: 8106}
  product-marketing:    {port: 8107}
  revenue-pulse:        {port: 8108}
  rep-brief:            {port: 8109}
  social-signals:       {port: 8110}
  reply-desk:           {port: 8111}
  enrichment:           {port: 8112}
  forecast-prep:        {port: 8113}
  stack-audit:          {port: 8114}
  signal-scout:         {port: 8115}
  copy-qa-gate:         {port: 8116}
  ops-monitor:          {port: 8117}

instances:

  pipeline:
    purpose: "Lead in and prospecting: inbound leads and replies, account ranking, sequences, copy gate."
    slack_channel: gtm-pipeline
    mcp: [lead-triage, reply-desk, enrichment, signal-scout, social-signals, rep-brief, icp-outbound, copy-qa-gate]
    agents:
      inbound-router:
        stage: Lead in
        job: "Every inbound lead and every reply: match, enrich, score, route to the right AE within the SLA, and draft the first response."
        tools: [lead-triage, reply-desk, enrichment, signal-scout/score_account, copy-qa-gate]
        skills: [agents/lead-triage/skill, agents/reply-desk/skill, agents/enrichment/skill, lib:sales-lead-routing, lib:sales-lead-score, lib:sales-enrich, lib:sales-data-hygiene, lib:sales-meeting-scheduler, lib:clay-gtm-outbound, lib:sales-apollo, lib:sales-zoominfo]
      signal-scout:
        stage: Prospecting
        job: "Rank each AE's accounts daily on ICP fit plus buying signals (including social engagement), explain every score, and deliver each AE's morning brief."
        tools: [signal-scout, social-signals, rep-brief]
        skills: [agents/signal-scout/skill, agents/social-signals/skill, agents/rep-brief/skill, lib:sales-intent, lib:sales-account-map, lib:sales-prospect-list, lib:sales-trigify, lib:sales-rb2b, lib:sales-social-listening, lib:research-processes, lib:icp-persona]
      prospecting-writer:
        stage: Prospecting
        job: "Build the weekly target list and draft signal-led sequences for the top accounts, in the AE's voice, queued for the AE's approval."
        tools: [icp-outbound, copy-qa-gate]
        skills: [agents/icp-outbound/skill, lib:cold-email, lib:email-sequence, lib:copywriting, lib:made-to-stick, lib:influence-psychology, lib:sales-apollo-sequences, lib:sales-smartlead, lib:sales-lemlist, lib:sales-cadence, lib:sales-multichannel-selling, lib:sales-deliverability]
      copy-qa-gate:
        stage: Every outbound piece
        job: "Score every draft 0 to 40 (32 passes) and list exactly what to fix before an AE sees it."
        tools: [copy-qa-gate]
        skills: [agents/copy-qa-gate/skill, lib:avoid-ai-writing, lib:humanizer@blader-humanizer, lib:no-slop, lib:unslop, lib:copy-editing]

  deals:
    purpose: "Discovery through close: prep every meeting, capture every call, manage every deal, build every proposal."
    slack_channel: gtm-deals
    mcp: [sales-execution, meeting-intelligence, seller-follow-up, deal-inspection, product-marketing, copy-qa-gate]
    agents:
      meeting-prep:
        stage: Discovery, demo
        job: "Pre-call brief for every external meeting: account, attendees, pain, MEDDPICC questions, competitive angle, likely objections."
        tools: [sales-execution, product-marketing/battlecard, product-marketing/objection_library]
        skills: [agents/sales-execution/skill, lib:research-processes, lib:competitor-profiling, lib:competitor-intel, lib:sales-compete, lib:sales-demodesk, lib:sales-coaching]
      call-intel:
        stage: After every call
        job: "Read the transcript, extract MEDDPICC evidence, draft the recap and follow-up, and queue CRM updates for approval."
        tools: [meeting-intelligence, seller-follow-up/draft_recap, deal-inspection/update_meddpicc, copy-qa-gate]
        skills: [agents/meeting-intelligence/skill, lib:sales-call-review, lib:sales-gong, lib:sales-fathom, lib:sales-fireflies, lib:sales-meeting-ai, lib:sales-note-taker]
      deal-manager:
        stage: Mid-funnel
        job: "Weekly and on-demand deal inspection (stage age, slips, single threading, MEDDPICC gaps) plus each AE's overdue follow-ups, with the next move drafted."
        tools: [deal-inspection, seller-follow-up, copy-qa-gate]
        skills: [agents/deal-inspection/skill, agents/seller-follow-up/skill, lib:sales-deal-inspect, lib:sales-deal-room, lib:sales-mutualgro, lib:sales-data-hygiene]
      proposal-close:
        stage: Negotiate, close
        job: "Proposal outline, business case, pricing narrative and objection handling, grounded in config/company.yaml; tracks proposal engagement."
        tools: [sales-execution/proposal_outline, sales-execution/objection_help, product-marketing]
        skills: [agents/product-marketing/skill, lib:sales-proposal-template, lib:sales-proposal-page, lib:sales-proposal-analytics, lib:sales-getaccept, lib:pricing-strategy, lib:hundred-million-offers, lib:competitor-alternatives]

  revops:
    purpose: "Forecast, hygiene and learning: forecast calls, pipeline roll-ups, runtime health, win/loss and stack review."
    slack_channel: gtm-forecast
    mcp: [forecast-prep, revenue-pulse, ops-monitor, product-marketing, signal-scout, stack-audit]
    agents:
      forecast-hygiene:
        stage: Whole pipeline
        job: "Collect weekly AE forecast calls, prep the forecast meeting at AE, manager and exec level, deliver the weekly pulse, and watch runtime health."
        tools: [forecast-prep, revenue-pulse, ops-monitor]
        skills: [agents/forecast-prep/skill, agents/revenue-pulse/skill, agents/ops-monitor/skill, netclaw/shared/forecast-call, lib:sales-forecast, lib:sales-data-hygiene]
      win-loss-learning:
        stage: Closed won or lost
        job: "Win/loss by competitor and segment, outcomes recorded so signal weights learn, ICP refresh proposals, and the quarterly stack audit."
        tools: [product-marketing/win_loss_report, signal-scout/record_outcome, stack-audit]
        skills: [agents/stack-audit/skill, lib:sales-winn, lib:sales-call-review, lib:sales-customer-feedback]
