# Signal sourcing rules (Signal Sourcing agent). Edit once per customer, like icp.yaml.
# No signal = no send: an account reaches the dispatch batch only with at least one dated, sourced
# signal from the sources below. Sources are public and structured: SEC EDGAR, the company's own
# newsroom feed (or trusted press through an optional news API), and public job board APIs.
#
# The sample below fits the sample company in company.yaml (revenue agents for sales teams).
# A worked example for a network automation seller is at the bottom, commented out.

# ---- 1. Annual and quarterly filings (10-K, 10-Q): Risk Factors, MD&A, Business ----
filings:
  enabled: true
  forms: [10-K, 10-Q]
  max_age_days: 400
  topics:                      # a sentence must hit at least one `required` topic to count
    - id: sales_productivity
      say: sales productivity
      required: true
      weight: 3
      terms: [sales productivity, sales force effectiveness, sales efficiency, go-to-market efficiency,
              customer acquisition cost, sales capacity, quota attainment]
    - id: revenue_data
      say: revenue data quality
      weight: 2
      terms: [crm, customer relationship management, pipeline visibility, forecast accuracy, data quality]
    - id: ai_automation
      say: AI and automation
      weight: 2
      terms: [artificial intelligence, generative ai, machine learning, automation, ai-driven]
  high_needs: [sales_productivity, ai_automation]   # both in one sentence = High confidence
  specificity: [invest, investing, implement, deploy, adopt, initiative, program, transformation, headcount, reduce]

# ---- 2. Initiatives, appointments and funding from newsrooms and trusted press ----
news:
  enabled: true
  initiative_days: 180
  exec_days: 180
  funding_days: 180
  initiative_terms: [launches, launched, announces, invest, investing, investment, partnership, partners with,
                     rollout, rolls out, program, initiative, expands, deploys, selects, standardizes on]
  initiative_topics: [sales, revenue, go-to-market, customer acquisition, crm, sales enablement, ai, automation]
  trusted_press: [reuters.com, bloomberg.com, wsj.com, cnbc.com, businesswire.com, prnewswire.com, globenewswire.com]

# ---- 3. Hiring into the buying team (public job boards) ----
hiring:
  enabled: true
  max_age_days: 30
  # matched against job titles, case-insensitive, whole words
  buyer_roles: [chief revenue officer, vp of sales, vice president of sales, head of sales, sales operations,
                revenue operations, revops, sales enablement, head of growth, director of sales development]
  # Job search sites for companies with no public ATS board (most large enterprises use Workday or iCIMS).
  # pip install python-jobspy. LinkedIn stays off unless you list it: scraping it breaks LinkedIn's terms.
  job_search:
    enabled: false
    provider: jobspy
    mode: fallback          # fallback: only when no Greenhouse, Lever or Ashby board | always: add to the board
    sites: [indeed, google, zip_recruiter]
    results: 30
    country: usa

# ---- Page changes: changedetection.io watches (self-hosted, Apache-2.0) ----
# Point a notification at POST /v1/page-changes (body: JSON or the template in sources/pagewatch.py), or set
# CHANGEDETECTION_URL and CHANGEDETECTION_API_KEY to poll. Tag each watch gtm:<kind> and account:<domain>;
# `watch_plan` lists the URLs to add for your top accounts.
page_changes:
  enabled: true
  max_age_days: 60
  page_kinds:
    pricing: [/pricing, /plans]
    careers: [/careers, /jobs, /join-us]
    trust: [/trust, /security, /compliance]
    leadership: [/leadership, /team, /management, /about/leadership]
    news: [/press, /news, /newsroom, /blog]
  certifications: [soc 2, iso 27001, hipaa, fedramp, gdpr, pci dss]
  launch_terms: [introducing, now available, launches, launched]
  partnership_terms: [partnership, partners with, integration with]
  complementary_tools: [salesforce.com, hubspot.com, gong.io, outreach.io, salesloft.com, clari.com]
  competitor_tools: []      # script domains of competitors: timing only, never in copy

# ---- First-party: your website and product (PostHog) ----
# Push: a PostHog webhook destination to POST /v1/web-events. Poll: POSTHOG_HOST, POSTHOG_PROJECT_ID and
# POSTHOG_PERSONAL_API_KEY (query API). Visitors resolve to an account by their identified email's domain or a
# group property holding the company domain; anonymous traffic is dropped. Visits are timing only in copy;
# a trial signup may be mentioned.
first_party:
  enabled: true
  pricing_paths: [/pricing, /plans]
  high_intent_paths: [/demo, /contact-sales, /talk-to-sales, /security, /trust]
  content_paths: [/resources/, /whitepaper, /ebook, /report]
  content_events: [content_download, file_downloaded, ebook_download]
  signup_events: [signed_up, user_signed_up, trial_started]
  repeat_visits: {days: 7, min_days: 3}
  product_qualified: {events: [], min_events: 20, days: 7}   # list your key product events
  group_domain_properties: [company_domain, domain, $group_0]
  lookback_days: 7

# ---- 4. Executive appointments: 8-K item 5.02 and newsroom announcements ----
exec_change:
  enabled: true
  max_age_days: 180
  buyer_roles: [chief revenue officer, chief sales officer, chief commercial officer, vp of sales,
                vice president of sales, head of revenue operations, chief growth officer]
  csuite_roles: [chief executive officer, chief financial officer, chief operating officer, chief technology officer,
                 chief information officer, president]

# ---- Who never gets sourced or sent ----
exclusions:
  min_employees: 200                 # unless publicly traded
  suppression: []                    # domains that must never be sent (add over time)
  excluded_types:                    # by company name or industry; competitors and partners go here
    competitor: [acme intel, globex signals]
  thin_tlds: [dev, tech, ai, io, app, xyz, me]

# ---- Dispatch ----
dispatch:
  max_accounts: 25                   # a clean 8 beats a padded 25: never filled with weak rows
  target_personas: [Chief Revenue Officer, VP of Sales, Head of Revenue Operations]
  rescan_days: 7                     # how often each account is re-scanned

# ---- Discovery: new companies from SEC full-text search ----
discovery:
  enabled: true
  forms: 10-K,10-Q
  lookback_days: 120
  phrases: [sales productivity, go-to-market efficiency, sales force effectiveness]
  max_per_phrase: 50

