# One-command install on the customer's VM: `docker compose up -d`
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gtm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  agents:
    build: .
    image: gtm-agents:${GTM_VERSION:-0.1.0}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gtm:${POSTGRES_PASSWORD}@db:5432/gtm
    volumes:
      - ./data:/app/data
      - ./license.json:/app/license.json:ro
      - ./config:/app/config:ro
    depends_on:
      db: {condition: service_healthy}
    command: ["schedule"]
    restart: unless-stopped

  api:
    # Intake (leads, meetings, signals) and the approval queue over HTTP. Internal network only.
    image: gtm-agents:${GTM_VERSION:-0.1.0}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gtm:${POSTGRES_PASSWORD}@db:5432/gtm
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      db: {condition: service_healthy}
    command: ["serve-api", "--host", "0.0.0.0", "--port", "8787"]
    ports: ["127.0.0.1:8787:8787"]
    restart: unless-stopped

  slack-bot:
    # Chat with every agent from Slack (Socket Mode: no public URL). Needs SLACK_APP_TOKEN + SLACK_BOT_TOKEN.
    profiles: ["slack"]
    image: gtm-agents:${GTM_VERSION:-0.1.0}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gtm:${POSTGRES_PASSWORD}@db:5432/gtm
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db: {condition: service_healthy}
    command: ["slack-bot"]
    restart: unless-stopped

  ollama:
    # Optional open-weight model server on the same VM (CPU works for small models; GPU recommended).
    # Then set GTM_CHEAP_BASE_URL=http://ollama:11434/v1 and GTM_MODEL_CHEAP=<model you pulled>.
    profiles: ["local-model"]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

  vllm:
    # Optional GPU open-weight server (OpenAI-compatible). Set GTM_*_BASE_URL=http://vllm:8000/v1.
    profiles: ["gpu-model"]
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}", "--enable-auto-tool-choice",
              "--tool-call-parser", "hermes", "--max-model-len", "32768"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [hf:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  changedetection:
    # Optional page watches for owned signals (careers, pricing, trust, leadership, newsroom, scripts).
    # UI on 127.0.0.1:5000. Notification URL: json://api:8787/v1/page-changes?+Authorization=Bearer%20<GTM_API_TOKEN>
    # with the body from `gtm call signal-sourcing watch_plan`, or set CHANGEDETECTION_URL=http://changedetection:5000
    # and CHANGEDETECTION_API_KEY to poll instead.
    profiles: ["signals"]
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    volumes: [changedetection:/datastore]
    ports: ["127.0.0.1:5000:5000"]
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  hf:
  changedetection:
