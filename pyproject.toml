[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-agents"
version = "0.1.0"
description = "Turnkey GTM agents: shared core runtime plus per-agent skills, tools and evals"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "croniter>=2",
  "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
postgres = ["psycopg[binary]>=3.1"]
slack = ["slack_sdk>=3.27"]
aws = ["boto3>=1.34"]
rules = ["zen-engine>=2"]
workflows = ["dbos>=3"]
jobs = ["python-jobspy>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
gtm = "gtm_core.cli:main"

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "."]
