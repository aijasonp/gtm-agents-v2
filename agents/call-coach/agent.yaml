id: call-coach
name: Call Coach
version: 0.1.0
tier: B
description: >
  Roleplay and coaching for account executives. Runs discovery, objection, pricing, competitor and
  champion-building roleplays with the model as the buyer, scores any roleplay or real call transcript out
  of 100 on talk ratio, questions, open questions, monologues, MEDDPICC coverage, dated next steps and
  objection handling, and builds weekly drill plans from each rep's real calls. Never writes to the CRM.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/scenarios.yaml
  - skill/references/rubric.md
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-coaching
  - library/sales-skills/skills/sales-call-review
  - library/wondelai-skills/skills/influence-psychology
tools:
  - list_scenarios
  - start_roleplay
  - score_roleplay
  - drill_plan
connectors_required: []
connectors_optional: [slack]
jobs:
  - {name: weekly_drills, cron: "0 8 * * 1", model_class: none}
budgets: {daily_tokens: 600000, monthly_usd: 40}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  scenarios: skill/references/scenarios.yaml
  lookback_days: 30
  skill_bar: 75
