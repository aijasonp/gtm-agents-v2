id: copy-qa-gate
name: Copy QA Gate
version: 0.1.0
tier: C
description: >
  Scores any outbound email, LinkedIn message or post for AI tells, banned phrases,
  readability, length and claims, then rewrites it to pass. 32 of 40 passes.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/rubric.md
  - skill/references/banned-phrases.txt
  - skill/references/rewrite-patterns.md
tools:
  - check_copy
  - check_batch
connectors_required: []
connectors_optional: []
jobs: []
budgets: {daily_tokens: 500000, monthly_usd: 25}
evals: evals/golden.yaml
config:
  banned_file: skill/references/banned-phrases.txt
  max_words: 120
  pass_mark: 32
