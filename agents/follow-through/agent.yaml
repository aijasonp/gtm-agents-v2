id: follow-through
name: Follow-Through
version: 0.1.0
tier: A
description: >
  Makes sure no engaged prospect and no open conversation goes quiet. Engagement triggers from a
  RevOps-owned decision table (for example 3 human opens, a click, or 2 opens on a tier A account)
  pause automation and hand the person to the AE with a task, a sayable reason to reach out and an SLA.
  Opens are a timing signal only and never appear in copy. Every CRM write waits for approval.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/trigger-rules.md
  - ../../config/triggers.yaml
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-cadence
tools:
  - check_engagement
  - run_triggers
  - tee_ups
  - resolve_tee_up
  - explain_rules
connectors_required: []
connectors_optional: [crm, slack, sequencer]
jobs:
  - {name: evaluate_triggers, cron: "*/10 * * * *", model_class: none}
budgets: {daily_tokens: 0, monthly_usd: 0}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  icp: ../../config/icp.yaml
  triggers: ../../config/triggers.yaml
  trigger_table: engagement
  rules_engine: auto        # auto (zen when installed, else builtin) | builtin | zen
  timezone: America/Chicago # SLA business hours when company.yaml has no timezone
