id: follow-through
name: Follow-Through
version: 0.1.0
tier: A
description: >
  Makes sure no engaged prospect and no open conversation goes quiet. Engagement triggers from a
  RevOps-owned decision table (for example 3 human opens, a click, or 2 opens on a tier A account)
  pause automation and hand the person to the AE with a task, a sayable reason to reach out and an SLA.
  Opens are a timing signal only and never appear in copy. A cadence ledger (config/cadences.yaml) gives
  every contact in an active motion (after a meeting, an event, a tee-up or a proposal) one next touch with
  a due time: peer agents' drafts are checked, gaps are drafted for the AE to confirm one email at a time,
  and anything missed escalates to the owner, then the manager. Every write waits for approval.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/trigger-rules.md
  - skill/references/cadence-rules.md
  - ../../config/triggers.yaml
  - ../../config/cadences.yaml
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-cadence
tools:
  - check_engagement
  - run_triggers
  - tee_ups
  - resolve_tee_up
  - explain_rules
  - next_touches
  - cadence_status
  - log_touch
  - follow_up_coverage
  - start_motion
connectors_required: []
connectors_optional: [crm, slack, sequencer]
jobs:
  - {name: evaluate_triggers, cron: "*/10 * * * *", model_class: none}
  - {name: sweep_cadence, cron: "*/15 * * * *", model_class: frontier}
  - {name: coverage_report, cron: "0 8 * * 1-5", model_class: none}
budgets: {daily_tokens: 600000, monthly_usd: 40}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  icp: ../../config/icp.yaml
  triggers: ../../config/triggers.yaml
  cadences: ../../config/cadences.yaml
  lookback_days: 14         # motions start from meetings, events, tee-ups and proposals this recent
  max_words: 110
  trigger_table: engagement
  rules_engine: auto        # auto (zen when installed, else builtin) | builtin | zen
  timezone: America/Chicago # SLA business hours when company.yaml has no timezone
