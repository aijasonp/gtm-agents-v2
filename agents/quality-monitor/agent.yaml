id: quality-monitor
name: Quality Monitor
version: 0.1.0
tier: B
description: >
  Watches the quality of what the agents write in production. Each day it takes a fixed,
  repeatable sample of recent prospect-facing drafts from every agent, re-scores them with the
  Copy QA Gate, flags numbers and customer claims that are not in the approved proof points, and
  compares each agent's last 7 days against its prior 28-day baseline. It alerts when the mean
  gate score or the pass rate drops past the threshold. Writes nothing but its own findings.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/monitoring-method.md
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/avoid-ai-writing/skills/avoid-ai-writing
  - library/coreyhaines-marketingskills/skills/copy-editing
tools:
  - sample_drafts
  - quality_report
  - regression_check
  - draft_scorecard
connectors_required: []
connectors_optional: [slack]
jobs:
  - {name: daily_quality, cron: "30 7 * * 1-5", model_class: none}
budgets: {daily_tokens: 50000, monthly_usd: 5}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  banned_file: ../copy-qa-gate/skill/references/banned-phrases.txt
  max_words: 120
  pass_mark: 32
  sample_per_agent: 5
  recent_days: 7
  baseline_days: 28
  min_baseline_drafts: 5
  min_recent_drafts: 3
  score_drop_alert: 3          # points on the 40-point gate
  pass_rate_drop_alert: 10     # percentage points
  exclude_kinds: [battlecard, proposal, tool_cut_memo]   # internal documents, not prospect copy
