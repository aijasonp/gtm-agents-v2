       sent: "Hi Ben,\n\nYour team wants the routing data first. I can share the pilot plan. Is Thursday good?\n\nSam"}
    - {facts: {title: Director of Sales, industry: Healthcare},
       drafted: "Hi Cy,\n\nFollowing up as promised on our call. You need a security review before the pilot. I can send our answers. Does Monday work?\n\nSam",
       sent: "Hi Cy,\n\nYou need a security review before the pilot. I can send our answers. Does Monday work?\n\nSam"}
    - {facts: {title: VP Sales, industry: Retail},
