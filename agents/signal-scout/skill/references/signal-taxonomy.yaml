# Signal Scout taxonomy. Buyers tune base_weight and half_life_days for their motion;
# the weekly reweight job then learns from their own outcomes.
# say_it: how a rep may reference the signal in copy. Empty = use it for timing only, never mention it.
version: "1.0"
min_contribution: 0.15

categories:
  - id: leadership
    name: Leadership change
    half_life_days: 60
    signals:
      - {type: new_exec_in_buyer_function, name: New executive in the buying function, base_weight: 0.9, half_life_days: 90,
         say_it: "Congrats on the new role"}
      - {type: new_exec_c_suite, name: New C-suite executive, base_weight: 0.6}
      - {type: champion_joined, name: Past champion joined the account, base_weight: 1.0, half_life_days: 120,
         say_it: "Saw you landed at {company}"}
      - {type: buyer_departed, name: Known buyer left the account, base_weight: 0.3, half_life_days: 45}

  - id: hiring
    name: Hiring pattern
    half_life_days: 30
    signals:
      - {type: hiring_buyer_team, name: Hiring into the buying team, base_weight: 0.7,
         say_it: "Noticed you're growing the {team} team"}
      - {type: hiring_role_we_replace, name: Hiring a role the product automates, base_weight: 0.8, say_it: ""}
      - {type: hiring_surge, name: Headcount up 15%+ in 90 days, base_weight: 0.5, half_life_days: 45}
      - {type: hiring_freeze, name: Layoffs or hiring freeze, base_weight: 0.2, half_life_days: 60, say_it: ""}

  - id: money
    name: Funding and financial
    half_life_days: 90
    signals:
      - {type: funding_round, name: Raised a funding round, base_weight: 0.8, half_life_days: 120,
         say_it: "Congrats on the raise"}
      - {type: acquisition_made, name: Acquired a company, base_weight: 0.6, half_life_days: 120}
      - {type: was_acquired, name: Was acquired, base_weight: 0.4, half_life_days: 90}
      - {type: earnings_priority_mention, name: Earnings call names a matching priority, base_weight: 0.6, half_life_days: 90,
         say_it: "Your team called out {topic} on the last earnings call"}
      - {type: budget_cycle_open, name: Fiscal year planning window, base_weight: 0.4, half_life_days: 45, say_it: ""}

  - id: tech
    name: Technology change
    half_life_days: 60
    signals:
      - {type: adopted_complementary_tool, name: Adopted a complementary tool, base_weight: 0.5}
      - {type: competitor_installed, name: Uses a competitor, base_weight: 0.4, half_life_days: 180, say_it: ""}
      - {type: competitor_contract_renewal, name: Competitor renewal window, base_weight: 0.8, half_life_days: 60, say_it: ""}
      - {type: removed_tool, name: Removed a tool in our category, base_weight: 0.7, half_life_days: 45, say_it: ""}
      - {type: migration_project, name: Platform migration underway, base_weight: 0.5, half_life_days: 90}

  - id: growth
    name: Product and market expansion
    half_life_days: 60
    signals:
      - {type: new_product_launch, name: Launched a product, base_weight: 0.4, say_it: "Saw the {product} launch"}
      - {type: new_market_entry, name: Entered a new market or region, base_weight: 0.5, half_life_days: 90}
      - {type: new_office, name: Opened an office, base_weight: 0.3}
      - {type: partnership_announced, name: Announced a partnership, base_weight: 0.3}

  - id: intent
    name: Engagement and intent
    half_life_days: 14
    signals:
      - {type: pricing_page_visit, name: Visited pricing page, base_weight: 0.8, half_life_days: 10, say_it: ""}
      - {type: repeat_site_visits, name: Repeat website visits, base_weight: 0.5, half_life_days: 10, say_it: ""}
      - {type: content_download, name: Downloaded content, base_weight: 0.5, half_life_days: 21,
         say_it: "Thanks for grabbing the {asset}"}
      - {type: event_attended, name: Attended our event or booth, base_weight: 0.7, half_life_days: 30,
         say_it: "Good to see your team at {event}"}
      - {type: third_party_intent_surge, name: Third-party topic intent surge, base_weight: 0.4, half_life_days: 14, say_it: ""}
      - {type: email_engaged, name: Opened or clicked recent outreach, base_weight: 0.3, half_life_days: 7, say_it: ""}
      - {type: social_engagement, name: Engaged with our social posts, base_weight: 0.4, half_life_days: 14, say_it: ""}

  - id: social
    name: Social and content engagement
    half_life_days: 21
    signals:
      # Written by the Social Signals agent from LinkedIn and YouTube engagement exports.
      # Public comments and shares may be referenced; reactions, follows and views are timing only.
      - {type: social_buying_question, name: Asked a buying question in public comments, base_weight: 0.85, half_life_days: 14,
         say_it: "Saw your question under our \"{topic}\" post"}
      - {type: social_comment, name: Commented on our or a tracked creator's post, base_weight: 0.6, half_life_days: 21,
         say_it: "Saw your comment on our \"{topic}\" post"}
      - {type: social_share, name: Shared or reposted our content, base_weight: 0.5, half_life_days: 21,
         say_it: "Thanks for sharing our \"{topic}\" post"}
      - {type: social_follow, name: Followed or subscribed to our channels, base_weight: 0.3, half_life_days: 30, say_it: ""}
      - {type: social_reaction, name: Reacted to our content, base_weight: 0.25, half_life_days: 14, say_it: ""}
      - {type: content_view_repeat, name: Repeat views of our videos, base_weight: 0.3, half_life_days: 14, say_it: ""}

  - id: pain
    name: Public pain
    half_life_days: 45
    signals:
      - {type: negative_reviews_spike, name: Spike in negative customer reviews, base_weight: 0.4, say_it: ""}
      - {type: public_incident, name: Public outage or incident, base_weight: 0.6, half_life_days: 30, say_it: ""}
      - {type: exec_post_about_problem, name: Executive posted about the problem we solve, base_weight: 0.8, half_life_days: 30,
         say_it: "Your post on {topic} stuck with me"}

  - id: compliance
    name: Regulatory and compliance
    half_life_days: 120
    signals:
      - {type: new_regulation_applies, name: New regulation applies to them, base_weight: 0.6, half_life_days: 180,
         say_it: "With {regulation} coming into force"}
      - {type: audit_or_certification, name: Pursuing a certification or audit, base_weight: 0.5, half_life_days: 120}
      - {type: regulator_action, name: Regulator action or fine, base_weight: 0.5, half_life_days: 90, say_it: ""}

stacking_rules:
  - {id: two_categories, name: Two independent categories, min_categories: 2, min_signals: 2, multiplier: 1.15}
  - {id: three_categories, name: Three or more categories, min_categories: 3, min_signals: 3, multiplier: 1.3}
  - {id: change_plus_intent, name: Leadership change plus active intent, min_categories: 2, min_signals: 2,
     multiplier: 1.35, requires: [leadership, intent]}
  - {id: money_plus_hiring, name: Fresh money plus hiring into the buying team, min_categories: 2, min_signals: 2,
     multiplier: 1.25, requires: [money, hiring]}
