id: signal-scout
name: Signal Scout
version: 0.1.0
tier: A
description: >
  Watches buying signals across 8 categories, stacks and decays them, scores every account on
  ICP fit plus signal heat, and delivers a ranked daily list to Slack and the CRM.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/signal-taxonomy.yaml
  - ../../config/icp.yaml
  - ../../config/company.yaml
  - skill/references/scoring-method.md
  - skill/references/brief-format.md
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-intent
  - library/sales-skills/skills/sales-account-map
  - library/sales-skills/skills/sales-enrich
  - library/marketingagentskills/skills/clay-gtm-outbound
tools:
  - score_account
  - list_priority_accounts
  - explain_score
  - add_signal
  - record_outcome
  - push_to_crm
  - judge_account
connectors_required: []
connectors_optional: [crm, slack, enrichment]
jobs:
  - {name: sync_accounts, cron: "30 5 * * 1-5", model_class: none}
  - {name: daily_sweep, cron: "0 6 * * 1-5", model_class: none}
  - {name: weekly_reweight, cron: "0 3 * * 0", model_class: none}
budgets: {daily_tokens: 2000000, monthly_usd: 150}
evals: evals/golden.yaml
config:
  taxonomy: skill/references/signal-taxonomy.yaml
  icp: ../../config/icp.yaml
  company: ../../config/company.yaml
  icp_weight: 0.4
  icp_floor: 30
  lookback_days: 120
  brief_size: 20
  crm_fields: {score: gtm_signal_score, tier: gtm_signal_tier, reasons: gtm_signal_reasons}
  signal_inbox: data/signals/inbox
