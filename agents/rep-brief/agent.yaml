id: rep-brief
name: Rep Brief
version: 0.1.0
tier: A
description: >
  Brings the work to each rep: a daily brief with their top accounts and why now, the right people to
  contact, new signals, hot leads, replies to handle, pipeline gaps against quota and the three things to
  do next. Plus a push-button workflow: one call builds the account research, drafts the first touch and
  queues the email, the CRM task and the dialer call for the rep to approve. No BDR in between.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/brief-format.md
  - skill/references/push-button-workflow.md
  - skill/references/prioritization.md
  - ../../config/icp.yaml
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-account-map
  - library/sales-skills/skills/sales-cadence
  - library/coreyhaines-marketingskills/skills/cold-email
  - library/wondelai-skills/skills/predictable-revenue
tools:
  - my_brief
  - push_button
  - top_accounts
  - pipeline_gaps
  - whats_new
connectors_required: []
connectors_optional: [crm, slack, sequencer, dialer]
jobs:
  - {name: daily_briefs, cron: "30 7 * * 1-5", model_class: none}
budgets: {daily_tokens: 1500000, monthly_usd: 120}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  icp: ../../config/icp.yaml
  taxonomy: ../signal-scout/skill/references/signal-taxonomy.yaml
  do_not_contact: ../icp-outbound/skill/references/do-not-contact.yaml
  icp_floor: 30
  lookback_days: 120
  recent_touch_days: 45
  idle_days: 14
  coverage_target: 3.0
  top_accounts: 5
  contacts_per_account: 2
  max_words: 110
