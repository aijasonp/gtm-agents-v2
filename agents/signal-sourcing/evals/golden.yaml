# Golden cases on recorded responses (sample/fixtures): fictional companies, fake CIKs, no network.
now: "2026-10-20T12:00:00+00:00"
accounts: sample/accounts.json
fixtures: sample/fixtures
expect:
  rejected:
    fabrikamcapital.example: investor
    hcpleads.example: lead-gen
  sources:
    northwind.example: [exec_change, filing, hiring, initiative]
  filing:
    northwind.example: {confidence: High, date: "2026-08-05", form: 10-Q, contains: "artificial intelligence tools"}
    adatum.example: {confidence: Medium, date: "2026-03-01", form: 10-K, contains: "sales force effectiveness"}
  boilerplate_never_quoted: "forward-looking statements"
  exec_change_once: northwind.example
  hiring_roles:
    northwind.example: ["Director of Revenue Operations", "VP of Sales, Central"]
  initiative_amount:
    northwind.example: "$12M"
  notes:
    contoso.example: no sentence matching
    tailspin.example: no CIK match
  dispatch: [northwind.example]
  dispatch_excluded:
    adatum.example: placeholder
  rescan_stores: 0
  discovery: [Litware Manufacturing Corp]
  say_it:
    northwind.example: "Your latest 10-Q calls out sales productivity"

# Job search sites fill hiring for an enterprise with no public ATS board (provider stubbed: no network).
job_search:
  account: {id: wingtip.example, name: Wingtip Toys Inc, domain: wingtip.example, industry: Consumer Products,
            employees: 12000, country: US, ticker: WTPX}
  postings:
    - {site: indeed, title: "Vice President of Sales, Americas", company: Wingtip Toys, date: "2026-10-09",
       url: "https://jobs.example/wt-1"}
    - {site: google, title: "Senior Manager, Revenue Operations", company: Wingtip Toys Inc., date: "2026-10-14",
       url: "https://wingtip.example/careers/ro-2", company_url: "https://wingtip.example"}
    - {site: indeed, title: "Head of Sales", company: Wingtip Labs, date: "2026-10-15", url: "https://jobs.example/wl-3"}
    - {site: indeed, title: "Director of Sales Development", company: Wingtip Toys, date: "2026-08-01",
       url: "https://jobs.example/wt-4"}
  expect_roles: ["Senior Manager, Revenue Operations", "Vice President of Sales, Americas"]

# Page changes from changedetection.io (notifications recorded inline, no network).
page_changes:
  account: {id: proseware.example, name: Proseware Inc, domain: proseware.example, industry: Software,
            employees: 2500, country: US}
  pricing_only: {watch_url: "https://proseware.example/pricing", watch_tag: "gtm:pricing",
                 diff_added: "Enterprise plan: contact us", diff_removed: "Enterprise plan: $99 per seat"}
  careers: {watch_url: "https://proseware.example/careers", watch_tag: "gtm:careers",
            diff_added: "(added) Director of Sales Development\n(added) Head of Sales, EMEA\n(added) Payroll Specialist"}
  expect_careers_roles: ["Director of Sales Development", "Head of Sales, EMEA"]
