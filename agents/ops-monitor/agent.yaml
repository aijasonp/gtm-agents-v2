id: ops-monitor
name: Ops Monitor
version: 0.1.0
tier: C
description: >
  Watches the agent runtime itself so nothing stops silently. Checks every scheduled job against its
  cron (missed runs, repeated failures, runs stuck in progress), the approval queue (actions stuck while
  executing, approved but never run, an approver backlog), handoffs between agents (failed or waiting
  too long), budget pauses, token spend against each agent's budget, drafts failing the copy gate, and
  agents that failed to load. Alerts Slack only on new problems and recoveries, with a daily summary.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/checks.md
  - skill/references/runbook.md
library: []
tools:
  - health_report
  - job_status
  - stuck_items
  - spend_report
  - export_traces
connectors_required: []
connectors_optional: [slack]
jobs:
  - {name: health_check, cron: "*/15 * * * *", model_class: none}
  - {name: daily_ops_summary, cron: "0 8 * * 1-5", model_class: none}
  - {name: export_traces, cron: "*/5 * * * *", model_class: none}
budgets: {daily_tokens: 0, monthly_usd: 0}
evals: evals/golden.yaml
config:
  grace_minutes: 30            # a job is late once this long past its scheduled time with no run
  stuck_run_minutes: 60        # a run still "running" after this long is stuck
  executing_minutes: 15        # an approval stuck in "executing" after this long needs a human
  approved_hours: 2            # approved but not executed after this long
  pending_hours: 24            # approval waiting on a human after this long
  handoff_hours: 6             # handoff waiting for the receiving agent after this long
  spend_warn_pct: 80
  gate_fail_warn_pct: 30
  gate_min_drafts: 5
  alert_channel: ""            # empty = default Slack channel
