id: exec-brief
name: Exec Brief
version: 0.1.0
tier: A
description: >
  Daily pipeline-critical brief for each executive (CEO, CSO, CMO, VP Channel and Partnerships): exactly five
  numbers each, colored against target or pace, with the deals behind any red number. One company snapshot to a
  shared channel with the best and worst number for Sales, Marketing, Partners and Customer Success, and a
  leadership command center page that heat-maps every metric week over week. Reads Salesforce, Pardot and CS
  data from Snowflake. Cards are json-render specs rendered to native Slack blocks through Chat SDK. Every
  number is computed in code; the model writes one sentence per brief.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/metric-definitions.md
  - skill/references/card-format.md
  - ../../config/exec_brief.yaml
library:
  - library/coreyhaines-marketingskills/skills/revops
tools:
  - exec_metrics
  - exec_brief_preview
  - company_snapshot
  - command_center
connectors_required: []
connectors_optional: [warehouse, crm, slack]
jobs:
  # 12:45 UTC is 6:45am Central in winter (7:45am in summer). Read only: posts to Slack, writes nothing else.
  - {name: daily_exec_briefs, cron: "45 12 * * 1-5", model_class: frontier}
budgets: {daily_tokens: 60000, monthly_usd: 10}
evals: evals/golden.yaml
config:
  brief: ../../config/exec_brief.yaml
