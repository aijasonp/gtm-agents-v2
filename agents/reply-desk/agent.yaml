id: reply-desk
name: Reply Desk
version: 0.1.0
tier: A
description: >
  Classifies every reply to outbound in minutes (bounce, out of office, opt-out, referral, interested,
  objection, not now, question) with explained rules, then stops sequences, honors opt-outs at once,
  routes interested buyers to the owner with an SLA and drafts the response for approval.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/classification-rules.md
  - skill/references/actions.md
  - skill/references/reply-patterns.md
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-reply
  - library/sales-skills/skills/sales-inbox-zero
  - library/sales-skills/skills/sales-deliverability
  - library/blader-humanizer/skills/humanizer
tools:
  - classify_reply
  - add_reply
  - handle_reply
  - replies_needing_action
  - opt_out
connectors_required: []
connectors_optional: [crm, slack, sequencer]
jobs:
  - {name: process_replies, cron: "*/10 * * * *", model_class: frontier}
  - {name: reply_digest, cron: "0 17 * * 1-5", model_class: none}
budgets: {daily_tokens: 800000, monthly_usd: 60}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  reply_inbox: data/replies/inbox
  timezone: America/New_York        # for the response SLA in business hours
  business_hours: [9, 17]
  positive_sla_hours: 2              # business hours to answer an interested buyer
  not_now_default_days: 90
  ooo_default_days: 7
  low_confidence: 0.6                # below this, a model may refine the class (never on opt-out or bounce)
  default_owner: null                # falls back to the first owner in company.yaml
  crm_fields: {opt_out: gtm_do_not_contact}
  max_words: 110
