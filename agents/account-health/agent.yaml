id: account-health
name: Account Health
version: 0.1.0
tier: A
description: >
  Watches every existing customer for renewal risk and expansion readiness. Reads product usage (active
  users, core actions, features, teams, support load), conversation history (call transcripts and call
  insights), champion departures and account news; scores risk and expansion in code with the evidence
  behind each driver; ranks by renewal urgency; and recommends save, expand, watch or steady with the
  next actions. New saves and expansion plays queue a CRM task for the owner, after approval.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/health-rules.yaml
  - skill/references/health-method.md
  - skill/references/report-format.md
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-account-map
  - library/coreyhaines-marketingskills/skills/revops
tools:
  - account_health
  - at_risk_customers
  - expansion_ready
  - portfolio_summary
  - explain_health
  - add_usage
  - import_usage
connectors_required: []
connectors_optional: [crm, slack]
jobs:
  - {name: sync_customers, cron: "15 5 * * 1-5", model_class: none}
  - {name: import_usage_inbox, cron: "30 5 * * *", model_class: none}
  - {name: daily_health, cron: "45 6 * * 1-5", model_class: none}
  - {name: weekly_portfolio, cron: "15 8 * * 1", model_class: none}
budgets: {daily_tokens: 300000, monthly_usd: 25}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  rules: skill/references/health-rules.yaml
  usage_inbox: data/usage/inbox
  report_size: 10
