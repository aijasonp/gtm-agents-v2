# Enrichment providers and the order they are tried per field. Edit during install.
# A field stops at the first provider that returns a verified value. Results are cached for ttl_days.

default_country: US        # used to normalize phone numbers without a country code
ttl_days: 90               # never re-query the same person and field within this window
caps:
  per_run_usd: 25          # stop the run when spend in one run reaches this
  monthly_usd: 300         # stop all lookups for the month at this amount, alert Slack

order:                     # person fields
  email: [sample_csv, manual]
  phone: [sample_csv, manual]
  title: [sample_csv]
  linkedin: [sample_csv]
account_order:             # account firmographics
  employees: [sample_companies]
  industry: [sample_companies]
  revenue: [sample_companies]
  country: [sample_companies]

verifier: null             # name of a provider that checks emails, e.g. email_verifier below

providers:
  sample_csv:
    type: csv
    path: sample/enrichment.csv          # relative to the agent folder
    match_on: [email, linkedin, name_domain]
    outputs: {email: email, phone: phone, title: title, linkedin: linkedin}
    confidence: 0.9
    cost_per_call: 0
  sample_companies:
    type: csv
    path: sample/companies.csv
    match_on: [domain]
    outputs: {employees: employees, industry: industry, revenue: revenue, country: country}
    confidence: 0.85
    cost_per_call: 0
  manual:
    type: manual            # nothing found: listed for a human to research

