id: icp-outbound
name: ICP Outbound
version: 0.1.0
tier: A
description: >
  Builds a short, ranked outbound list from ICP fit and fresh buying signals, removes accounts
  already in a deal or recently contacted, picks the right buyers, and drafts a three-step
  sequence around a real reason to write now. Every send waits for human approval.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/targeting-rules.md
  - skill/references/sequence-patterns.md
  - skill/references/do-not-contact.yaml
  - ../../config/icp.yaml
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/coreyhaines-marketingskills/skills/cold-email
  - library/coreyhaines-marketingskills/skills/email-sequence
  - library/sales-skills/skills/sales-cadence
  - library/sales-skills/skills/sales-deliverability
  - library/sales-skills/skills/sales-prospect-list
  - library/marketingagentskills/skills/icp-persona
  - library/wondelai-skills/skills/predictable-revenue
  - library/wondelai-skills/skills/influence-psychology
tools:
  - build_target_list
  - why_now
  - pick_contacts
  - draft_sequence
  - check_conflicts
connectors_required: []
connectors_optional: [crm, slack, sequencer]
jobs:
  - {name: weekly_list_build, cron: "30 6 * * 1", model_class: none}
  - {name: daily_drafts, cron: "0 7 * * 1-5", model_class: frontier}
budgets: {daily_tokens: 1500000, monthly_usd: 120}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  icp: ../../config/icp.yaml
  taxonomy: ../signal-scout/skill/references/signal-taxonomy.yaml
  do_not_contact: skill/references/do-not-contact.yaml
  icp_floor: 30
  list_tiers: [A, B, C]
  icp_only_min: 60
  lookback_days: 120
  recent_touch_days: 45
  max_contacts_per_account: 3
  list_size: 25
  daily_cap: 10
  max_words: 110
