id: deal-inspection
name: Deal Inspection
version: 0.1.0
tier: A
description: >
  Inspects every open deal each week for qualification quality, stall risk and wrong fit:
  stage age, activity, close-date slips, next steps, MEDDPICC gaps by stage, stakeholder coverage
  and ICP fit. Gives each deal a risk score with the drivers behind it and a recommendation
  (progress, fix or disqualify) with specific fixes. Call evidence from Meeting Intelligence fills
  MEDDPICC gaps, and CRM updates wait for approval.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/stage-rules.yaml
  - skill/references/inspection-method.md
  - skill/references/output-format.md
  - ../../config/icp.yaml
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-deal-inspect
  - library/sales-skills/skills/sales-forecast
  - library/coreyhaines-marketingskills/skills/revops
tools:
  - inspect_deal
  - list_at_risk
  - meddpicc_gaps
  - update_meddpicc
  - recommend_action
connectors_required: []
connectors_optional: [crm, slack]
jobs:
  - {name: sync_deals, cron: "30 6 * * 1-5", model_class: none}
  - {name: weekly_inspection, cron: "0 7 * * 1", model_class: none}
  - {name: apply_evidence, cron: "10 * * * *", model_class: none}
budgets: {daily_tokens: 500000, monthly_usd: 40}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  icp: ../../config/icp.yaml
  rules: skill/references/stage-rules.yaml
  report_size: 25
