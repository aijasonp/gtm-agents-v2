id: proposal-builder
name: Proposal Builder
version: 0.1.0
tier: B
description: >
  Prices quotes from the price book and writes the branded proposal. Applies volume tiers, multi-year
  term discounts and extra discounts with exact cent math, checks every discount against the role limit
  and the price floor, queues discounts above the limit for approval and blocks anything below the floor.
  Builds the proposal from the deal's MEDDPICC evidence, company.yaml claims and the quote, and queues the
  customer send for approval.
editions: [dropin, persistent]
skill: skill/SKILL.md
references:
  - skill/references/pricing-method.md
  - skill/references/proposal-format.md
  - ../../config/pricebook.yaml
  - ../../config/company.yaml
library:  # licensed playbooks bundled into the drop-in package (see THIRD_PARTY_NOTICES.md)
  - library/sales-skills/skills/sales-proposal-template
  - library/sales-skills/skills/sales-proposal-page
  - library/wondelai-skills/skills/hundred-million-offers
tools:
  - list_products
  - build_quote
  - check_discount
  - render_proposal
  - send_proposal
  - get_quote
connectors_required: []
connectors_optional: [crm, slack]
jobs:
  - {name: expiring_quotes, cron: "0 8 * * 1", model_class: none}
budgets: {daily_tokens: 300000, monthly_usd: 20}
evals: evals/golden.yaml
config:
  company: ../../config/company.yaml
  pricebook: ../../config/pricebook.yaml
  output_dir: ../../data/proposals   # gitignored; point at a shared folder in production
  expiry_warning_days: 7
