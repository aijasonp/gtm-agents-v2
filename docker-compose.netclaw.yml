# Optional NetClaw front end over the runtime. Use with the base compose file:
#
#   python3 netclaw/build.py --config config
#   docker compose -f docker-compose.yml -f docker-compose.netclaw.yml up -d
#   ./netclaw/install.sh
#
# gtm-tools serves every runtime agent's tools over MCP. Each NetClaw instance needs
# its own Slack app (Socket Mode) so events are not split between instances.

x-netclaw: &netclaw
  image: ${NETCLAW_IMAGE:-ghcr.io/netclaw-dev/netclaw:latest}   # pin a version for production
  restart: unless-stopped
  env_file: .env
  environment: &netclaw-env
    NETCLAW_Models__Main__Type: ${MAIN_MODEL_TYPE:-anthropic}
    NETCLAW_Models__Main__ModelId: ${MAIN_MODEL_ID:?set MAIN_MODEL_ID in .env}
    NETCLAW_Models__Compaction__Type: ${SMALL_MODEL_TYPE:-ollama}
    NETCLAW_Models__Compaction__ModelId: ${SMALL_MODEL_ID:?set SMALL_MODEL_ID in .env}
    NETCLAW_Models__Compaction__Endpoint: ${SMALL_MODEL_ENDPOINT:-}
  depends_on: [gtm-tools]

services:
  gtm-tools:
    image: gtm-agents:${GTM_VERSION:-0.1.0}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gtm:${POSTGRES_PASSWORD}@db:5432/gtm
      FLEET: /app/netclaw/fleet.yaml
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./license.json:/app/license.json:ro
      - ./netclaw:/app/netclaw:ro
    entrypoint: ["sh", "/app/netclaw/serve_tools.sh"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  netclaw-pipeline:
    <<: *netclaw
    environment:
      <<: *netclaw-env
      NETCLAW_Slack__BotToken: ${PIPELINE_SLACK_BOT_TOKEN:?}
      NETCLAW_Slack__AppToken: ${PIPELINE_SLACK_APP_TOKEN:?}
    volumes:
      - netclaw-pipeline:/home/netclaw/.netclaw
      - ./dist/netclaw/pipeline/skills:/opt/gtm/skills:ro
      - ./dist/netclaw/pipeline:/opt/gtm/instance:ro

  netclaw-deals:
    <<: *netclaw
    environment:
      <<: *netclaw-env
      NETCLAW_Slack__BotToken: ${DEALS_SLACK_BOT_TOKEN:?}
      NETCLAW_Slack__AppToken: ${DEALS_SLACK_APP_TOKEN:?}
    volumes:
      - netclaw-deals:/home/netclaw/.netclaw
      - ./dist/netclaw/deals/skills:/opt/gtm/skills:ro
      - ./dist/netclaw/deals:/opt/gtm/instance:ro

  netclaw-revops:
    <<: *netclaw
    environment:
      <<: *netclaw-env
      NETCLAW_Slack__BotToken: ${REVOPS_SLACK_BOT_TOKEN:?}
      NETCLAW_Slack__AppToken: ${REVOPS_SLACK_APP_TOKEN:?}
    volumes:
      - netclaw-revops:/home/netclaw/.netclaw
      - ./dist/netclaw/revops/skills:/opt/gtm/skills:ro
      - ./dist/netclaw/revops:/opt/gtm/instance:ro

volumes:
  netclaw-pipeline:
  netclaw-deals:
  netclaw-revops:
